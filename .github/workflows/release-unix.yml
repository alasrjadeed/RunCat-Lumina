name: release-unix

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing tag to publish the packages to (empty = build artifacts only)"
        required: false
        default: ""

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  linux:
    # Build on the oldest glibc still practical so the binary runs on older
    # distros (22.04 -> glibc 2.35, covers Ubuntu 22.04+, Debian 12+, Fedora 36+).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Run tests (under Xvfb)
        run: xvfb-run -a python tests/run_tests.py

      - name: Build standalone package
        run: bash packaging/linux/build-linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux-package
          path: dist/unix/RunCatLumina-*-linux-*.tar.gz
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pyobjc-framework-Quartz

      - name: Run tests
        run: python tests/run_tests.py

      - name: Build .app bundle and DMG
        run: bash packaging/macos/build-macos.sh

      - uses: actions/upload-artifact@v4
        with:
          name: macos-package
          path: dist/unix/RunCatLumina-*-macos-*.dmg
          if-no-files-found: error

  publish:
    needs: [linux, macos]
    if: github.ref_type == 'tag' || inputs.release_tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish packages to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="${{ inputs.release_tag }}"
          fi
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [ "${{ github.ref_type }}" = "tag" ] && [ "$TAG" != "v$VERSION" ]; then
            echo "Tag $TAG does not match VERSION $VERSION - bump VERSION or fix the tag."
            exit 1
          fi
          ls -la artifacts/
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
          else
            gh release create "$TAG" artifacts/* \
              --title "RunCat Lumina $VERSION" \
              --generate-notes \
              || gh release upload "$TAG" artifacts/* --clobber
          fi
          # Never leave the release as a draft.
          RID=$(gh release view "$TAG" --json databaseId -q .databaseId)
          gh api -X PATCH "repos/${{ github.repository }}/releases/$RID" -F draft=false >/dev/null
          echo "Release $TAG assets:"
          gh release view "$TAG" --json assets -q '.assets[].name'
